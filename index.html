<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scott Achs</title>
<meta name="description" content="Color photographs and videos by Scott Achs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --postal-green: #4E6B58;
    --paper: #F7F7F4;
    --beige: #D9C8A6;
    /* Every divider line uses this one setting, so they always match. */
    --divider: 1px solid var(--beige);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--postal-green);
    color: var(--paper);
    font-family: 'Lora', Georgia, 'Times New Roman', serif;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--beige);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 28px;
  }

  /* Intro */
  .intro {
    padding: 72px 0 48px;
  }

  .intro h1 {
    font-weight: 400;
    /* Full size on computers. Shrinks a little on small phones so the title stays on one line. */
    font-size: min(2.5rem, calc((100vw - 40px) / 13.9));
    line-height: 1.2;
    margin: 0 0 18px;
    color: var(--paper);
  }

  .intro p {
    font-size: 1.02rem;
    line-height: 1.65;
    color: var(--paper);
    max-width: 46ch;
    margin: 0;
  }

  /* Ledger
     The label row carries its own top line. On phones the label is
     hidden and its line goes with it, so two lines never stack.
     The ledger's bottom line always sits under the last site. */
  .ledger {
    border-bottom: var(--divider);
  }

  .ledger-labels {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    padding: 14px 0;
    border-top: var(--divider);
    font-style: italic;
    font-size: 0.9rem;
    color: var(--paper);
  }

  .entry {
    border-top: var(--divider);
  }

  .entry-link {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    align-items: start;
    margin: 0 -28px;
    padding: 26px 28px;
    transition: background 0.15s ease;
  }

  .entry-link:hover {
    background: rgba(217, 200, 166, 0.08);
  }

  .entry-name {
    font-weight: 600;
    font-size: 1.22rem;
    color: var(--paper);
    margin: 0 0 6px;
  }

  .entry-desc {
    font-size: 0.96rem;
    line-height: 1.65;
    color: var(--paper);
    margin: 0 0 10px;
    max-width: 46ch;
  }

  /* Contact, under the bottom line */
  .contact {
    padding: 22px 0 72px;
    font-size: 0.96rem;
    line-height: 1.65;
    color: var(--paper);
  }

  .contact-label {
    font-style: italic;
  }

  .contact a {
    text-decoration: underline;
    text-decoration-color: var(--beige);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }

  .contact a:hover {
    text-decoration-color: var(--paper);
  }

  /* Mobile */
  @media (max-width: 600px) {
    .ledger-labels { display: none; }

    .entry-link {
      grid-template-columns: 1fr;
      gap: 6px;
      margin: 0 -20px;
      padding: 22px 20px;
    }

    .wrap { padding: 0 20px; }

    .intro { padding: 48px 0 40px; }

    .contact { padding: 20px 0 48px; }
  }
</style>
  <script>
(function () {
  var id = 'G-NVLHKT2DQN';
  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag('js', new Date());
  gtag('config', id);
})();
</script>
</head>
<body>

<div class="wrap">

  <section class="intro">
    <h1>Color Photographs &amp; Videos</h1>
  </section>

  <section class="ledger" id="ledger">
    <div class="ledger-labels">
      <span>Project</span>
    </div>
    <!-- entries injected by script below -->
  </section>

  <footer class="contact">
    <span class="contact-label">Contact:</span>
    <a href="mailto:scottachs@gmail.com">scottachs@gmail.com</a>
  </footer>

</div>

<script>
  // Add future sites here — each becomes a row in the ledger, in order.
  const entries = [
    {
      year: "ongoing",
      name: "Photography",
      description: "Quiet color studies of small-town Vermont, swimming holes, and empty rooms, shot on a Mamiya 7 and 35mm, an inquiry into banality and the American vernacular.",
      url: "https://www.scottachsphotography.com"
    },
    {
      year: "ongoing",
      name: "YouTube",
      description: "Videos in and around Vermont.",
      url: "https://www.youtube.com/@clumpykitty3906"
    }
  ];

  const ledger = document.getElementById('ledger');

  entries.forEach(function (entry) {
    const row = document.createElement('div');
    row.className = 'entry';

    row.innerHTML =
      '<a class="entry-link" href="' + entry.url + '">' +
        '<span>' +
          '<p class="entry-name">' + entry.name + '</p>' +
          '<p class="entry-desc">' + entry.description + '</p>' +
        '</span>' +
      '</a>';

    ledger.appendChild(row);
  });
</script>

</body>
</html>
