<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scott Achs</title>
<meta name="description" content="Color photographs and videos by Scott Achs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --postal-green: #4E6B58;
    --paper: #F7F7F4;
    --beige: #D9C8A6;
    /* Every divider line uses this one setting, so they always match. */
    --divider: 1px solid var(--beige);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--postal-green);
    color: var(--paper);
    font-family: 'Lora', Georgia, 'Times New Roman', serif;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--beige);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 28px;
  }

  /* One centered column, exactly as wide as the logo.
     The lines and text below fill it, but they can never make it wider. */
  .column {
    width: -moz-fit-content;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;
    padding-bottom: 72px;
  }

  .ledger {
    width: 0;
    min-width: 100%;
  }

  /* Intro */
  .intro {
    padding: 72px 0 28px;
  }

  .intro h1 {
    margin: 0;
    line-height: 0;
  }

  /* Your logo, drawn as shapes from your business card file.
     Its width sets the column, so the lines below always match it.
     It gets smaller on phones so it always fits. */
  .logo {
    display: block;
    width: min(17.5rem, calc(100vw - 56px));
    height: auto;
    aspect-ratio: 149.35 / 41.902;
    overflow: visible;
    color: var(--paper);
  }

  /* Ledger: a line above each site, and one line under the last site. */
  .ledger {
    border-bottom: var(--divider);
  }

  .entry {
    border-top: var(--divider);
  }

  .entry-link {
    display: grid;
    grid-template-columns: 1fr;
    align-items: start;
    padding: 26px 0;
  }

  .entry-name {
    font-weight: 600;
    font-size: 1.22rem;
    color: var(--paper);
    margin: 0 0 6px;
    text-decoration: underline;
    text-decoration-color: transparent;
    text-decoration-thickness: 1px;
    text-underline-offset: 4px;
    transition: text-decoration-color 0.15s ease;
  }

  .entry-link:hover .entry-name {
    text-decoration-color: var(--beige);
  }

  .entry-desc {
    font-size: 0.96rem;
    line-height: 1.65;
    color: var(--paper);
    margin: 0 0 10px;
  }

  /* Mobile */
  @media (max-width: 600px) {
    .entry-link { padding: 22px 0; }

    .wrap { padding: 0 20px; }

    .intro { padding: 48px 0 22px; }

    .column { padding-bottom: 48px; }
  }
</style>
