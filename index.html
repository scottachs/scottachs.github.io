<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scott Achs</title>
<meta name="description" content="Color photographs and videos by Scott Achs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --postal-green: #4E6B58;
    --paper: #F7F7F4;
    --beige: #D9C8A6;
    /* Every divider line uses this one setting, so they always match. */
    --divider: 1px solid var(--beige);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--postal-green);
    color: var(--paper);
    font-family: 'Lora', Georgia, 'Times New Roman', serif;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--beige);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 28px;
  }

  /* One centered column, exactly as wide as the title.
     The lines and text below fill it, but they can never make it wider. */
  .column {
    width: -moz-fit-content;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;
    padding-bottom: 72px;
  }

  .ledger {
    width: 0;
    min-width: 100%;
  }

  /* Intro */
  .intro {
    padding: 72px 0 48px;
  }

  .intro h1 {
    font-weight: 400;
    /* Full size on computers. Shrinks a little on small phones so the title stays on one line. */
    font-size: min(2.5rem, calc((100vw - 40px) / 13.9));
    line-height: 1.2;
    margin: 0 0 18px;
    text-align: center;
    color: var(--paper);
  }

  /* Ledger: a line above each site, and one line under the last site. */
  .ledger {
    border-bottom: var(--divider);
  }

  .entry {
    border-top: var(--divider);
  }

  .entry-link {
    display: grid;
    grid-template-columns: 1fr;
    align-items: start;
    padding: 26px 0;
  }

  .entry-name {
    font-weight: 600;
    font-size: 1.22rem;
    color: var(--paper);
    margin: 0 0 6px;
    text-decoration: underline;
    text-decoration-color: transparent;
    text-decoration-thickness: 1px;
    text-underline-offset: 4px;
    transition: text-decoration-color 0.15s ease;
  }

  .entry-link:hover .entry-name {
    text-decoration-color: var(--beige);
  }

  .entry-desc {
    font-size: 0.96rem;
    line-height: 1.65;
    color: var(--paper);
    margin: 0 0 10px;
  }

  /* Mobile */
  @media (max-width: 600px) {
    .entry-link { padding: 22px 0; }

    .wrap { padding: 0 20px; }

    .intro { padding: 48px 0 40px; }

    .column { padding-bottom: 48px; }
  }
</style>
  <script>
(function () {
  var id = 'G-NVLHKT2DQN';
  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag('js', new Date());
  gtag('config', id);
})();
</script>
</head>
<body>

<div class="wrap">
  <div class="column">

    <section class="intro">
      <h1>Color Photographs &amp; Videos</h1>
    </section>

    <section class="ledger" id="ledger">
      <!-- entries injected by script below -->
    </section>

  </div>
</div>

<script>
  // Add future sites here — each becomes a row in the ledger, in order.
  const entries = [
    {
      year: "ongoing",
      name: "Photography",
      description: "Quiet color studies of small-town Vermont, swimming holes, and empty rooms, shot on a Mamiya 7 and 35mm, an inquiry into banality and the American vernacular.",
      url: "https://www.scottachsphotography.com"
    },
    {
      year: "ongoing",
      name: "YouTube",
      description: "Videos in and around Vermont.",
      url: "https://www.youtube.com/@clumpykitty3906"
    }
  ];

  const ledger = document.getElementById('ledger');

  entries.forEach(function (entry) {
    const row = document.createElement('div');
    row.className = 'entry';

    row.innerHTML =
      '<a class="entry-link" href="' + entry.url + '">' +
        '<span>' +
          '<p class="entry-name">' + entry.name + '</p>' +
          '<p class="entry-desc">' + entry.description + '</p>' +
        '</span>' +
      '</a>';

    ledger.appendChild(row);
  });
</script>

</body>
</html>
