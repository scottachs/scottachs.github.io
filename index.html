<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scott Achs</title>
<meta name="description" content="An index of small tools, experiments, and work by Scott Achs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --ink: #F5F5F1;
    --ink-soft: #A6A49B;
    --yellow: #FFD400;
    --hairline: #2B2B27;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--yellow);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 28px;
  }

  /* Intro */
  .intro {
    padding: 72px 0 48px;
  }

  .intro h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(1.9rem, 4vw, 2.5rem);
    line-height: 1.2;
    margin: 0 0 18px;
    max-width: 22ch;
    color: var(--ink);
  }

  .intro p {
    font-size: 1.02rem;
    line-height: 1.65;
    color: var(--ink-soft);
    max-width: 46ch;
    margin: 0;
  }

  /* Ledger */
  .ledger {
    border-top: 1px solid var(--hairline);
  }

  .ledger-labels {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    padding: 14px 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .entry {
    border-top: 1px solid var(--hairline);
  }

  .entry-link {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    align-items: start;
    margin: 0 -28px;
    padding: 26px 28px;
    transition: background 0.15s ease;
  }

  .entry-link:hover {
    background: rgba(255, 212, 0, 0.06);
  }

  .entry-name {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.22rem;
    color: var(--yellow);
    margin: 0 0 6px;
  }

  .entry-desc {
    font-size: 0.96rem;
    line-height: 1.6;
    color: var(--ink);
    margin: 0 0 10px;
    max-width: 46ch;
  }

  /* Mobile */
  @media (max-width: 600px) {
    .ledger-labels { display: none; }

    .entry-link {
      grid-template-columns: 1fr;
      gap: 6px;
      margin: 0 -20px;
      padding: 22px 20px;
    }

    .wrap { padding: 0 20px; }

    .intro { padding: 48px 0 40px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <section class="intro">
    <h1>An index of small builds and what have you's</h1>
  </section>

  <section class="ledger" id="ledger">
    <div class="ledger-labels">
      <span>Project</span>
    </div>
    <!-- entries injected by script below -->
  </section>

</div>

<script>
  // Add future sites here — each becomes a row in the ledger, in order.
  const entries = [
    {
      year: "ongoing",
      name: "Photography",
      description: "Quiet color studies of small-town Vermont, swimming holes, and empty rooms, shot on a Mamiya 7 and 35mm, an inquiry into banality and the American vernacular.",
      url: "https://www.scottachsphotography.com"
    },
    {
      year: "2026",
      name: "Song Lens",
      description: "Type in any song and get a close read of its lyrics, influences, and hidden references, plus a few deep cuts worth queuing up next.",
      url: "https://scottachs.github.io/songlens/"
    },
    {
      year: "ongoing",
      name: "YouTube",
      description: "Videos in and around Vermont.",
      url: "https://www.youtube.com/@clumpykitty3906"
    },
    {
      year: "2026",
      name: "Baccarat",
      description: "Learn how to play baccarat. Once you learn the game, play live on the simulator.",
      url: "https://scottachs.github.io/baccarat/"
    },
    {
      year: "2026",
      name: "Wet-Bulb Calculator",
      description: "Enter temperature and humidity to see the wet-bulb reading and heat-stress risk.",
      url: "https://scottachs.github.io/wetbulbcalculator/"
    },
    {
      year: "2026",
      name: "Recipes",
      description: "A running collection of recipes worth repeating, tested more than once before they make the cut.",
      url: "#" // placeholder — update once this site is live
    }
  ];

  const ledger = document.getElementById('ledger');

  entries.forEach(function (entry) {
    const row = document.createElement('div');
    row.className = 'entry';

    row.innerHTML =
      '<a class="entry-link" href="' + entry.url + '">' +
        '<span>' +
          '<p class="entry-name">' + entry.name + '</p>' +
          '<p class="entry-desc">' + entry.description + '</p>' +
        '</span>' +
      '</a>';

    ledger.appendChild(row);
  });
</script>

</body>
</html>
